<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HRD Radar</title>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-logo-bg"></div>

    <img
        class="header-character"
        src="assets/characters/newspaper-character.png"
        alt="신문지 캐릭터"
    />

    <nav class="category-nav" aria-label="뉴스레터 카테고리">
      <button type="button" class="category-tab active" data-category="all">전체</button>
      <button type="button" class="category-tab" data-category="ai-ax">AI/AX 교육</button>
      <button type="button" class="category-tab" data-category="onboarding">신입사원 교육</button>
      <button type="button" class="category-tab" data-category="promotion">승격자 교육</button>
      <button type="button" class="category-tab" data-category="leadership">리더 교육</button>
      <button type="button" class="category-tab" data-category="culture">조직활성화 교육</button>
    </nav>
  </header>

  <main class="page">
    <div id="default-home-content">
    <section class="hero-section">
      {{ featured_article }}
    </section>

    <section class="section-block">
      <div class="section-title-row">
        <h2>오늘의 추천 기사</h2>
        <a href="#">전체보기</a>
      </div>

      <div class="article-grid four">
        {{ recommended_articles }}
      </div>
    </section>
    </div>

    <div id="category-content">
      {{ category_sections }}
    </div>

    <section class="subscribe-box">
      <div>
        <h2>매일 하나씩 HRD 인사이트를 받아보세요</h2>
        <p>AI가 선별한 HRD 기사와 우리 부서 적용 아이디어를 HTML 메일로 전송합니다.</p>
      </div>

      <form>
        <input type="email" placeholder="이메일 주소 입력" />
        <button type="button">구독하기</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <strong>multicampus HRD Radar</strong>
    <span>AI-curated HRD newsletter automation project</span>
  </footer>

  <script>
    const tabs = document.querySelectorAll(".category-tab");
    const defaultContent = document.getElementById("default-home-content");
    const sections = document.querySelectorAll(".category-section");
    const validCategories = new Set(["all", "ai-ax", "onboarding", "promotion", "leadership", "culture"]);

    function applyCategory(category, updateHash = true) {
      const safeCategory = validCategories.has(category) ? category : "all";

      tabs.forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.category === safeCategory);
      });

      defaultContent.hidden = safeCategory !== "all";
      sections.forEach((section) => {
        section.hidden = safeCategory !== "all" && section.dataset.category !== safeCategory;
      });

      if (updateHash) {
        const nextHash = safeCategory === "all" ? "" : `#category=${safeCategory}`;
        history.replaceState(null, "", `${location.pathname}${location.search}${nextHash}`);
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => applyCategory(tab.dataset.category));
    });

    const initialMatch = location.hash.match(/^#category=([a-z-]+)$/);
    applyCategory(initialMatch ? initialMatch[1] : "all", false);
  </script>
</body>
</html>
